services:
  - type: web
    name: iti-bus-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: TIMEZONE
        value: Africa/Cairo
      - key: DAILY_START_TIME
        value: "11:45"
      - key: ROUTE_KEYWORD
        value: "6 أكتوبر"
      - key: PICKUP_KEYWORD
        value: "ليلة القدر"
      - key: DIRECTION
        value: return
      - key: BOOKING_ENABLED
        value: "true"
      - key: TELEGRAM_API_BASE
        value: https://telegram-proxy.abdelrahmanataa17.workers.dev
      - key: ITI_STORAGE_STATE
        sync: false
      - key: ITI_EMAIL
        sync: false
      - key: ITI_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
