name: ITI Bus Daily Auto-Booker

on:
  schedule:
    # Cairo is UTC+2 (winter time).
    # Target booking opens at 11:45 AM Cairo (= 09:45 AM UTC).
    # Runs Sunday to Thursday (0-4 in cron).
    # We register multiple individual cron triggers starting 15 minutes early:
    # - 09:30 UTC = 11:30 AM Cairo
    # - 09:35 UTC = 11:35 AM Cairo
    # - 09:40 UTC = 11:40 AM Cairo
    # - 09:44 UTC = 11:44 AM Cairo
    # Redundancy strategy:
    # 1. Separate individual cron lines are strictly compatible with GitHub Actions POSIX parser.
    # 2. Starting early shields against GitHub Actions runner queue delays (5-10 min jitter).
    # 3. Once the runner starts early, the agent's Node.js timer holds until 11:45:00.000 Cairo.
    # 4. Once a booking succeeds, subsequent runs detect the confirmed booking and exit in 2 seconds.
    - cron: '30 9 * * 0-4'
    - cron: '35 9 * * 0-4'
    - cron: '40 9 * * 0-4'
    - cron: '44 9 * * 0-4'
  workflow_dispatch:
    inputs:
      route_keyword:
        description: 'Bus Route (e.g. 6 أكتوبر or رمسيس)'
        required: false
        default: '6 أكتوبر'
        type: string
      pickup_keyword:
        description: 'Pickup Stop (e.g. ليلة القدر or رمسيس)'
        required: false
        default: 'ليلة القدر'
        type: string
      daily_start_time:
        description: 'Cairo Start Time (HH:MM e.g. 11:45 or 11:59)'
        required: false
        default: '11:45'
        type: string
      monitoring_window_minutes:
        description: 'Monitoring Window in Minutes (default: 20)'
        required: false
        default: '20'
        type: string
      booking_enabled:
        description: 'Enable Booking (uncheck for dry-run check only)'
        required: false
        default: true
        type: boolean

jobs:
  book-bus:
    name: Monitor and Book Bus
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Application
        run: npm run build

      - name: Restore Session Cache
        uses: actions/cache/restore@v4
        with:
          path: data/storage-state.json
          key: iti-session-v2-${{ github.run_id }}
          restore-keys: |
            iti-session-v2-

      - name: Execute Monitoring & Booking
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          ITI_STORAGE_STATE: ${{ secrets.ITI_STORAGE_STATE }}
          ITI_EMAIL: ${{ secrets.ITI_EMAIL }}
          ITI_PASSWORD: ${{ secrets.ITI_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_BASE: ${{ secrets.TELEGRAM_API_BASE || 'https://telegram-proxy.abdelrahmanataa17.workers.dev' }}
          BOOKING_ENABLED: ${{ github.event.inputs.booking_enabled != '' && github.event.inputs.booking_enabled || vars.BOOKING_ENABLED || 'true' }}
          EXIT_ON_SUCCESS: "true"
          WAIT_FOR_SCHEDULE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          DAILY_START_TIME: ${{ github.event.inputs.daily_start_time || vars.DAILY_START_TIME || '11:45' }}
          MONITORING_WINDOW_MINUTES: ${{ github.event.inputs.monitoring_window_minutes || vars.MONITORING_WINDOW_MINUTES || '20' }}
          POLL_INTERVAL_MS: "15000"
          WATCH_DATE_OFFSETS: "0"
          ROUTE_KEYWORD: ${{ github.event.inputs.route_keyword || vars.ROUTE_KEYWORD || '6 أكتوبر' }}
          PICKUP_KEYWORD: ${{ github.event.inputs.pickup_keyword || vars.PICKUP_KEYWORD || 'ليلة القدر' }}
          DIRECTION: "return"
          TIMEZONE: "Africa/Cairo"
          HEADLESS: "true"
        run: npm start

      - name: Save Session Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/storage-state.json
          key: iti-session-v2-${{ github.run_id }}
